services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: erasmus
      POSTGRES_PASSWORD: erasmus
      POSTGRES_DB: erasmus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erasmus -d erasmus"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
